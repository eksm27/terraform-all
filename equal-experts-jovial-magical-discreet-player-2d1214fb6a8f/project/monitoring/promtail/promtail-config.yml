server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: fastapi-app

    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: name
            values: ["fastapi-app"]

    relabel_configs:
      # Extract container name (removes leading "/")
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # stdout / stderr
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

      # Static labels
      - target_label: service
        replacement: fastapi-app

      - target_label: env
        replacement: dev

    pipeline_stages:
      # Parse JSON logs from FastAPI (python-json-logger)
      - json:
          expressions:
            level: level
            message: message
            method: method
            path: path
            status_code: status_code
            duration_ms: duration_ms
            client: client
            timestamp: timestamp

      # Promote fields as labels (for querying in Grafana)
      - labels:
          level:
          method:
          path:
          status_code:

      # Use app timestamp instead of ingestion time
      - timestamp:
          source: timestamp
          format: RFC3339Nano
          fallback_formats:
            - "2006-01-02 15:04:05,000"
            - RFC3339